<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            right: 35px;
            border: 3px solid green;
            background-color: red;
            
        }
        .absolute{
            position: absolute;
            left: 0px;
            border: 3.5px solid orangered;
            opacity: 0.8;
        }
        .relative{
            position: relative;
            left: 85px;
            border: 3.5px solid pink;
            opacity: 0.6;
        }
        .fixed{
            position: fixed;
            top: 0px;
            right: 25px;
            border: 3.5px solid blue;
            opacity: 0.4;
        }
        .sticky{
            position: sticky;
            top: 0;
            left: 45px;
            border: 3.5px solid black;
            opacity: 0.1;
        }
    </style>
</head>
<body>
    <h2>POSITIONING</h2>

<div>

Div with no position property

</div>

<div class="sticky">

Div with sticky position property

</div>

<div class="relative">

This div element has position: relative;

<div class="absolute">

Absolute class DIV

</div>
</div>
<div class="fixed">
Div with fixed position property
</div>
